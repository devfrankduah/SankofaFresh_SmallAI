name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deploy in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pages from a private repository needs a paid plan, so the job skips until the repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Unreviewed translation drafts (web/*.draft.json) must never ship.
      - name: Stage web/ without drafts
        run: |
          mkdir -p _site
          cp -R web/. _site/
          find _site -name '*.draft.json' -delete
          test -f _site/index.html
          ls -R _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5

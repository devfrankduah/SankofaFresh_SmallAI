name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Node runs only the JS tests. package.json exists solely to mark .js files as ES modules for Node 18;
      # it has no dependencies and there is no build step.
      - uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

      - name: Run JS tests
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/*.mjs)
          if [ ${#files[@]} -eq 0 ]; then echo "No JS tests yet."; exit 0; fi
          for file in "${files[@]}"; do
            echo "node $file"
            node "$file"
          done

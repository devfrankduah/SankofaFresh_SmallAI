name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Node runs only the JS tests. package.json exists solely to mark .js files as ES modules for Node 18;
      # it has no dependencies and there is no build step.
      - uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

      # Data and contract tests are tests/test_*.mjs; app tests are tests/*.test.mjs. Each runs once.
      - name: Run data and contract JS tests
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/test_*.mjs)
          if [ ${#files[@]} -eq 0 ]; then echo "No data or contract JS tests yet."; exit 0; fi
          for file in "${files[@]}"; do
            echo "node $file"
            node "$file"
          done

      - name: Run app JS tests
        if: hashFiles('tests/*.test.mjs') != ''
        run: node --test tests/*.test.mjs

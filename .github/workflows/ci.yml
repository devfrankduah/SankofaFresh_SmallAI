name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Node runs only the parity test; the app itself has no package.json and no build step.
      - uses: actions/setup-node@v7
        with:
          node-version: "18"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest

      - name: Run JS parity test
        if: hashFiles('tests/test_parity.mjs') != ''
        run: node tests/test_parity.mjs
